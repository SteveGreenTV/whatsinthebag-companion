name: macOS ARM64 test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS ARM64 DMG
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS ARM64 DMG
        run: npm run release:mac:arm64

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: WITB_Companion_macos_arm64_test
          path: release/WITB_Companion_*_macos_arm64.dmg
          if-no-files-found: error
          retention-days: 7
