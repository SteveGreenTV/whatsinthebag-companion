name: Windows Portable Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Tag must match package.json version: v$version"
          }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run release:win:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Generate checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $artifact = Get-Item "release/WITB_Companion_$version.exe"
          $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content "$($artifact.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            release/*.exe
            release/*.exe.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --generate-notes --title "WITB Companion $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create GitHub release.' }
          }
          $artifacts = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @artifacts --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release artifacts.' }